name: Hardening

on:
  pull_request:
  push:
    branches:
      - receipt-rebuild
      - main
      - master

jobs:
  site-less-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile production Python
        run: python -m compileall -q smartprocess_erpnext_accounting
      - name: AST hardening contracts
        run: python tools/check_hardening_ast.py
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Isolated JavaScript contracts
        run: |
          node smartprocess_erpnext_accounting/smartprocess_accounting/tests/test_receipt_ui.js
          node smartprocess_erpnext_accounting/smartprocess_accounting/tests/test_settlement_workbench.js
          node smartprocess_erpnext_accounting/smartprocess_accounting/tests/test_receipt_conversion_ui.js
          node smartprocess_erpnext_accounting/smartprocess_accounting/tests/test_party_profile.js
          node smartprocess_erpnext_accounting/smartprocess_accounting/tests/test_party_account_explorer_ui.js
