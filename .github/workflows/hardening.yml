name: Hardening

on:
  pull_request:
  push:
    branches:
      - receipt-rebuild
      - main
      - master

jobs:
  site-less-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile production Python
        run: python -m compileall -q smartprocess_erpnext_accounting
      - name: AST hardening contracts
        run: python tools/check_hardening_ast.py
