name: sp-accounting-v2-proof

services:
  db:
    image: mariadb:11.8
    environment:
      MARIADB_ROOT_PASSWORD: ${PROOF_DB_ROOT_PASSWORD}
      MARIADB_ROOT_HOST: "%"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - proof-only

  redis-cache:
    image: redis:8.6-alpine
    command: redis-server --save ""
    volumes:
      - redis-cache-data:/data
    networks:
      - proof-only

  redis-queue:
    image: redis:8.6-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-queue-data:/data
    networks:
      - proof-only

  backend:
    image: frappe/erpnext:v16.35.0
    command: bench serve --port 8000
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: /home/frappe/frappe-bench/apps/smartprocess_erpnext_accounting:/home/frappe/frappe-bench/apps/sp_accounting_native_proof
    depends_on:
      db:
        condition: service_healthy
      redis-cache:
        condition: service_started
      redis-queue:
        condition: service_started
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
      - ../..:/home/frappe/frappe-bench/apps/smartprocess_erpnext_accounting:ro
      - ./app_overlay:/home/frappe/frappe-bench/apps/sp_accounting_native_proof:ro
      - ./apps.txt:/home/frappe/frappe-bench/sites/apps.txt:ro
    networks:
      - proof-only

  websocket:
    image: frappe/erpnext:v16.35.0
    command: node /home/frappe/frappe-bench/apps/frappe/socketio.js
    depends_on:
      redis-queue:
        condition: service_started
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
      - ./apps.txt:/home/frappe/frappe-bench/sites/apps.txt:ro
    networks:
      - proof-only

  frontend:
    image: frappe/erpnext:v16.35.0
    command: nginx-entrypoint.sh
    environment:
      BACKEND: backend:8000
      SOCKETIO: websocket:9000
      FRAPPE_SITE_NAME_HEADER: sp_accounting_v2_test
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: 120
      CLIENT_MAX_BODY_SIZE: 50m
    depends_on:
      - backend
      - websocket
    ports:
      - "127.0.0.1:8091:8080"
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
      - ./apps.txt:/home/frappe/frappe-bench/sites/apps.txt:ro
      - ./nginx-frappe.conf.template:/templates/nginx/frappe.conf.template:ro
    networks:
      proof-only:
        aliases:
          - sp_accounting_v2_test
      host-access:

networks:
  proof-only:
    name: sp_accounting_v2_proof_network
    internal: true
  host-access:
    name: sp_accounting_v2_proof_host_access

volumes:
  db-data:
    name: sp_accounting_v2_proof_db
  redis-cache-data:
    name: sp_accounting_v2_proof_redis_cache
  redis-queue-data:
    name: sp_accounting_v2_proof_redis_queue
  sites:
    name: sp_accounting_v2_proof_sites
  logs:
    name: sp_accounting_v2_proof_logs
