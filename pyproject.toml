[project]
name = "smartprocess_erpnext_accounting"
authors = [
    { name = "Smart Process", email = "info@smartprocess.local" }
]
description = "گردش حسابداری مستقل «تبدیل» برای ERPNext"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
erpnext = ">=16.0.0,<17.0.0"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["F", "E", "W", "I", "B"]
ignore = ["E501", "W191"]
